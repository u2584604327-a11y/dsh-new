name: DSH P39 exact original EngineManager Process API seam audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p39_original_process_surface.py'
      - 'host_candidate/P39_ORIGINAL_PROCESS_SEAM_GATE.md'
      - '.github/workflows/p39-original-process-seam.yml'
permissions:
  contents: read
concurrency:
  group: p39-original-process-seam-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  signed-original-exact-process-surface:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p39-exact-host-process-seam-audit-20261029' &&
      github.event.pull_request.base.ref == 'dsh/p38-real-node-process-stream-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private repo and audited read-only scanner
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO" --jq .visibility)" = private
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python -m py_compile host_candidate/p39_original_process_surface.py
      - name: Fetch exact signed original v138 baseline into temporary CI storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .p39tmp
          gh release download dsh-baseline-v135dsh-baseline-v135 \
            --repo "$GH_REPO" \
            --pattern DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --dir .p39tmp
          file=.p39tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk
          test -s "$file"
          test "$(stat -c %s "$file")" -eq 147341486
          expected=3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5
          echo "$expected  $file" | sha256sum --check -
          echo 'P39_EXACT_ORIGINAL_APK_SHA256=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Derive bounded Process surface and audit P37 compatibility
        shell: bash
        run: |
          set -euo pipefail
          python host_candidate/p39_original_process_surface.py \
            .p39tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --report .p39tmp/process-surface.json | tee .p39tmp/summary.txt
          python3 - <<'PY'
          import json
          s=json.load(open('.p39tmp/process-surface.json'))
          assert s['baseline_apk_sha256']=='3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5'
          assert s['primary_start_code_off']==3163260
          assert s['primary_start_pc']==3912
          assert s['p35_lifecycle_edges_pinned'] is True
          assert s['real_original_app_installed_overwritten'] is False
          assert s['engine_family_methods_inspected']>0
          assert s['direct_interesting_callsite_count']>0
          methods=s['original_java_process_and_stream_apis']
          print('P39_EXACT_ENGINE_PROCESS_API_SURFACE=PASS_STATIC')
          print('P39_REQUIRED_PROCESS_APIS_COUNT='+str(len(methods)))
          print('P39_DEX_CALLSITE_PATCH_OR_ART_RUNTIME=NOT_ATTEMPTED')
          print('P39_ORIGINAL_DSH_PRODUCTION_HOST=UNWIRED')
          print('P39_V139_RELEASE=BLOCKED')
          PY
          grep -F 'P39_EXACT_SIGNED_V138_SHA' .p39tmp/summary.txt >> "$GITHUB_STEP_SUMMARY"
          grep -F 'P39_REQUIRED_JAVA_PROCESS_METHODS' .p39tmp/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'P39_ORIGINAL_ENGINEMANAGER_WIRED=NO' >> "$GITHUB_STEP_SUMMARY"
      - name: Always destroy original APK and trace report; never upload artifacts
        if: always()
        shell: bash
        run: |
          rm -rf .p39tmp
          echo 'P39_ORIGINAL_APK_BYTES_AND_TRACED_DETAILS_DESTROYED=YES' >> "$GITHUB_STEP_SUMMARY"
          echo 'P39_BINARY_PATCH_AND_SIGNATURE=NOT_ATTEMPTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P39_V139_RELEASE=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
