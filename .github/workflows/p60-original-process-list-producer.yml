name: DSH P60 exact original ProcessBuilder List return producer
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p60_return_producer/**'
      - 'host_candidate/P60_PROCESS_LIST_RETURN_PRODUCER_GATE.md'
      - '.github/workflows/p60-original-process-list-producer.yml'
permissions:
  contents: read
concurrency:
  group: p60-private-producer-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  original-static-producer-only:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p60-original-process-list-return-producer-20261030' &&
      github.event.pull_request.base.ref == 'dsh/p59-exact-processbuilder-argument-backward-slice-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Private scope and synthetic producer/branch/range regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "u2584604327-a11y/dshe"
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python -m py_compile host_candidate/p60_return_producer/*.py
          python host_candidate/p60_return_producer/test_p60_return_producer.py > .p60_synthetic.log
          grep -Eq '^P60_PRODUCER_SYNTHETIC_TESTS=PASS assertions=[0-9]+$' .p60_synthetic.log
          grep -Fxq 'P60_SYNTHETIC_ONLY_REAL_APK_NOT_READ=YES' .p60_synthetic.log
          echo 'P60_PRODUCER_NEGATIVE_GATES=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Original signed v138 hash/tree provenance and List producer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .p60_private
          gh release download dsh-baseline-v135dsh-baseline-v135 \
            --repo "$GH_REPO" --pattern DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --dir .p60_private
          original=.p60_private/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk
          printf '%s  %s\n' \
            3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5 \
            "$original" | sha256sum -c - >/dev/null
          python host_candidate/p60_return_producer/p60_return_producer.py "$original" > .p60_private/categorical.log
          grep -Fxq 'P60_P59_P58_P57_P56_P54_SIGNED_V138_PROVENANCE=PASS' .p60_private/categorical.log
          grep -Fxq 'P60_CONSTRUCTOR_LIST_PRODUCER_LOCAL_SLICE=PASS' .p60_private/categorical.log
          grep -Fxq 'P60_LIST_ELEMENTS_AND_REAL_ARGV_PROVEN=NO' .p60_private/categorical.log
          grep -Fxq 'P60_ORIGINAL_CLASS_METHOD_JS_PATH_ARGV_ENV_VALUES_EMITTED=NO' .p60_private/categorical.log
          grep -Fxq 'P60_FIXED_SIGNED_V139=BLOCKED' .p60_private/categorical.log
          grep '^P60_CATEGORICAL_ONLY_PRODUCER=' .p60_private/categorical.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep '^P60_UNRESOLVED_SIMPLE_BRANCH_OFFSETS=' .p60_private/categorical.log | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'P60_REAL_ARGV_AND_READY_PROTOCOL=NOT_PROVEN' >> "$GITHUB_STEP_SUMMARY"
          echo 'P60_PRODUCTION_DSH_V139_SIGNING=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
      - name: Always delete original APK and temporary input/output
        if: always()
        shell: bash
        run: |
          rm -rf .p60_private .p60_synthetic.log
          echo 'P60_ORIGINAL_BINARY_AND_SCRIPTS_NOT_PUBLISHED=YES' >> "$GITHUB_STEP_SUMMARY"
          echo 'P60_OWNER_DEVICE_AND_PRODUCTION=UNCHANGED' >> "$GITHUB_STEP_SUMMARY"
