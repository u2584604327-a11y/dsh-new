name: P87 DSH OmniGate incremental SSE and Android UI refresh contract
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p87_omnigate_sse/**'
      - 'host_candidate/p43_original_service/build_embedded_emulator_apk.sh'
      - 'host_candidate/p43_original_service/android/com/dsh/android/p43/P43ProbeActivity.java'
      - 'host_candidate/P87_OMNIGATE_DSH_INCREMENTAL_SSE_GATE.md'
      - '.github/workflows/p87-omnigate-sse-ui.yml'
permissions:
  contents: read
jobs:
  sse-http-and-android35-native-chat-ui:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p87-omnigate-openai-sse-incremental-ui-20261030' &&
      github.event.pull_request.base.ref == 'dsh/p86-real-p6-node-android-webview-relay-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '1'
      P51_X86_SIMULATOR_ONLY: '1'
      P72_ACCESSOR_FIXTURE_ONLY: '1'
      P74_FIXTURE_ENGINE_BRIDGE: '1'
      P75_RENDEZVOUS_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Streaming parser and real chunked HTTP InputStream tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "u2584604327-a11y/dshe"
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          mkdir -p .p87_private/jvm
          javac --release 8 -d .p87_private/jvm \
            host_candidate/p87_omnigate_sse/src/com/dsh/android/p87/P87SseDecoder.java \
            host_candidate/p87_omnigate_sse/test/com/dsh/android/p87/P87SseDecoderTest.java \
            host_candidate/p87_omnigate_sse/test/com/dsh/android/p87/P87HttpStreamingTest.java
          java -cp .p87_private/jvm com.dsh.android.p87.P87SseDecoderTest | tee .p87_private/parser.log
          java -cp .p87_private/jvm com.dsh.android.p87.P87HttpStreamingTest | tee .p87_private/http.log
          grep -Eq 'P87_UTF8_SSE_INCREMENTAL_EVENTS_DONE_BOUNDS=PASS assertions=[0-9]+' .p87_private/parser.log
          grep -Fxq 'P87_EOF_WITHOUT_DONE_IS_TRUNCATED=PASS' .p87_private/parser.log
          grep -Fxq 'P87_HTTP_CHUNKED_SSE_REAL_INPUTSTREAM_INCREMENTAL=PASS' .p87_private/http.log
          grep -Fxq 'P87_FIRST_CONTENT_BEFORE_UPSTREAM_EOF=PASS' .p87_private/http.log
          bash -n host_candidate/p87_omnigate_sse/run_android_ui.sh
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          SDK="$ANDROID_HOME"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager";then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 | head -n1 || true)"
          fi
          test -n "$manager"
          "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          echo 'P87_HTTP_TRANSPORT_AND_PARSER=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Build SHA-pinned original-derived distinct Android package
        shell: bash
        run: |
          set -euo pipefail
          bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p87_private/build.log 2>&1 || {
            grep -E 'P87_|P47_|P51_|error:|Traceback' .p87_private/build.log | tail -n 50 || true
            exit 1
          }
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p87_private/build.log
          grep -Fxq 'P51_SIGNED_APK_SEPARATE_PACKAGE_NO_PERMISSIONS=PASS' .p87_private/build.log
          test -s .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk
          echo 'P87_ORIGINAL_DERIVED_SEPARATE_PACKAGE_BUILD=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: KVM if available
        run: if test -c /dev/kvm;then sudo chmod 666 /dev/kvm;fi
      - name: Real Android35 TextView incremental UI before terminal SSE
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p87_omnigate_sse/run_android_ui.sh
      - name: Always clean test signer and original artifacts
        if: always()
        run: |
          rm -rf .p87_private .p43tmp
          echo 'P87_OMNIGATE_LIVE_DSH_MAIN_ACTIVITY_UI=NOT_VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P87_NO_ORIGINAL_GATEWAY_OWNER_PORT_ROTATION=YES' >> "$GITHUB_STEP_SUMMARY"
          echo 'P87_FIXED_SIGNED_V139=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
