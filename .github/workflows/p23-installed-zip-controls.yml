name: DSH P23 installed APK ZIP native Bionic loader control Android35
on:
  pull_request:
    paths:
      - 'host_candidate/p23_zipcontrol/**'
      - '.github/workflows/p23-installed-zip-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p23-installed-zip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-android35-installed-apk-zip-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Android35 SDK and NDK toolchains
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager";then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 2>/dev/null | head -n1 || true)"
          fi
          test -n "$manager"
          "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          NDK=""
          if test -d "$SDK/ndk";then
            NDK="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1 || true)"
          fi
          if test -z "$NDK";then
            "$manager" --sdk_root="$SDK" 'ndk;27.2.12479018'
            NDK="$SDK/ndk/27.2.12479018"
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          echo "SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$NDK" >> "$GITHUB_ENV"
      - name: Build identical ELF test library and no-network JNI fixed control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/native out/classes out/dex out/pkg/lib/x86_64 out/pkg/assets
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          "$CC" -fPIC -shared -O2 \
            -Wl,-soname,libp22version.so.3 -Wl,-z,max-page-size=16384 \
            host_candidate/p23_zipcontrol/native/versioned.c \
            -o out/native/libp22version.so.3
          "$CC" -fPIC -shared -O2 -Wl,-z,max-page-size=16384 \
            host_candidate/p23_zipcontrol/native/zipbridge.c -ldl \
            -o out/native/libp23bridge.so
          readelf -d out/native/libp22version.so.3 | grep -Fq 'Library soname: [libp22version.so.3]'
          readelf -h out/native/libp23bridge.so | grep -Fq 'Advanced Micro Devices X86-64'
          cp out/native/libp22version.so.3 out/pkg/lib/x86_64/
          cp out/native/libp22version.so.3 out/pkg/assets/p23control.so
          cp out/native/libp22version.so.3 out/pkg/assets/p23control.so.3
          cp out/native/libp23bridge.so out/pkg/lib/x86_64/
          for path in out/pkg/lib/x86_64/libp22version.so.3 out/pkg/assets/p23control.so out/pkg/assets/p23control.so.3;do
            sha256sum "$path" | cut -d' ' -f1
          done | sort -u | grep -E '^[0-9a-f]{64}$' > out/unique-hashes.txt
          test "$(wc -l < out/unique-hashes.txt)" -eq 1
          echo 'P23_IDENTICAL_THREE_ELF_LIBRARY_BYTES=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Build 16KiB aligned disposable APK and throwaway signature
        shell: bash
        run: |
          set -euo pipefail
          javac --release 8 -cp "$SDK_ROOT/platforms/android-35/android.jar" \
            -d out/classes \
            host_candidate/p23_zipcontrol/android/com/dsh/p23/zipcontrol/P23ControlActivity.java \
            host_candidate/p23_zipcontrol/android/com/dsh/p23/zipcontrol/P23ControlWorker.java
          jar cf out/p23.jar -C out/classes .
          "$SDK_ROOT/build-tools/35.0.0/d8" --min-api 34 \
            --lib "$SDK_ROOT/platforms/android-35/android.jar" \
            --output out/dex out/p23.jar
          "$SDK_ROOT/build-tools/35.0.0/aapt" package -f \
            -M host_candidate/p23_zipcontrol/android/AndroidManifest.xml \
            -I "$SDK_ROOT/platforms/android-35/android.jar" \
            -F out/p23-unsigned.apk
          (cd out/dex && zip -q -j ../p23-unsigned.apk classes.dex)
          (cd out/pkg && zip -q -0 ../p23-unsigned.apk \
            lib/x86_64/libp23bridge.so lib/x86_64/libp22version.so.3 \
            assets/p23control.so assets/p23control.so.3)
          python3 host_candidate/p23_zipcontrol/align_package.py out/p23-unsigned.apk \
            --out out/p23-aligned.apk --report out/p23-zip-alignment.json
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 4 out/p23-aligned.apk
          LAB_PASSWORD="$(openssl rand -hex 16)"
          keytool -genkeypair -alias disposable -keyalg RSA -keysize 3072 \
            -validity 1 -storetype PKCS12 \
            -dname 'CN=P23 DISPOSABLE INSTALLED ZIP CONTROL' \
            -keystore out/p23-ci-key.p12 -storepass "$LAB_PASSWORD" \
            -keypass "$LAB_PASSWORD" -noprompt >/dev/null 2>&1
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks out/p23-ci-key.p12 --ks-key-alias disposable \
            --ks-pass "pass:$LAB_PASSWORD" --key-pass "pass:$LAB_PASSWORD" \
            --out out/p23-disposable.apk out/p23-aligned.apk
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify out/p23-disposable.apk
          if grep -Fq '<uses-permission' host_candidate/p23_zipcontrol/android/AndroidManifest.xml;then
            echo '::error::P23 installed ZIP test cannot request Android permissions'
            exit 1
          fi
          echo 'P23_EPHEMERAL_ANDROID35_APK_COMPILED=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare hardware accelerated Android35 emulator
        shell: bash
        run: |
          if test -c /dev/kvm;then sudo chmod 666 /dev/kvm;fi
      - name: Inspect real installed APK from isolated UID and call actual native dlopen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p23_zipcontrol/run_emulator.sh
      - name: Destroy ephemeral APK, signing key, all log output and synthetic ELF
        if: always()
        shell: bash
        run: |
          rm -rf out
          echo 'P23_REAL_ARM64_NODE_EVER_STARTED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P23_ORIGINAL_DSH_OR_SIGNING_MATERIAL_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P23_PRODUCTION_RELEASE=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
