name: DSH ART-safe diagnostic deny independent candidate preflight

on:
  push:
    branches: [main]
    paths:
      - 'host_candidate/patch_deny_art_safe.py'
      - '.github/workflows/art-safe-deny-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dex-code-and-try-edges:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact original APK and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          gh release download dsh-baseline-v135dsh-baseline-v135 --repo "$GH_REPO" \
            --pattern DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk --dir input
          printf '%s  %s\n' 3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5 \
            input/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk | sha256sum -c -
          python -m pip install -r host_candidate/requirements.txt
      - name: Compute ART-safe deny and P2/P8 follow-up native hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,sys,zipfile
          sys.path.insert(0,'host_candidate')
          from patch_deny import sha
          from patch_deny_art_safe import apply_art_safe
          import patch_browser,patch_privacy,patch_native_export_reply
          with zipfile.ZipFile('input/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk') as app:
              original=app.read('classes.dex')
          d1,r1=apply_art_safe(original)
          patch_browser.EXPECTED_P1=sha(d1)
          d2,r2=patch_browser.apply_browser(d1)
          patch_privacy.EXPECTED=sha(d2)
          d3,r3=patch_privacy.apply_privacy(d2)
          patch_native_export_reply.EXPECTED_P2=sha(d3)
          d4,r4=patch_native_export_reply.apply(d3)
          report={
            'P1_ART_SAFE_DENY_SHA256':sha(d1),
            'P2_BROWSER_SHA256':sha(d2),
            'P3_WEBVIEW_PRIVACY_SHA256':sha(d3),
            'P8_NATIVE_EXPORT_REDACT_SHA256':sha(d4),
            'TRY_INSTRUCTION_BOUNDARY':r1['TRY_START_END_AND_HANDLER_ALIGNMENT'],
            'DIAGNOSTIC_HTTP_SINK_STATUS':'NOT_INDEPENDENTLY_VALIDATED',
            'LEGACY_DIAGNOSTICS_DEFAULT_DENY':r1['LEGACY_DIAGNOSTIC_UPLOAD'],
            'P8_NATIVE_JSON_BUNDLEPATH_REMOVED':r4['NATIVE_EXPORT_REPLY_BUNDLE_PATH_REMOVED'],
            'ART_EXECUTION':'NOT_PERFORMED',
            'APK_SIGNING':'NOT_PERFORMED'
          }
          pathlib.Path('out/art-safe-hashes.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          echo 'NEW_ART_SAFE_DENY_STATIC=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'OLD_P2_ART_VERIFIER=KNOWN_FAIL' >> "$GITHUB_STEP_SUMMARY"
          echo 'NEW_ART_RUNTIME=NOT_VERIFIED' >> "$GITHUB_STEP_SUMMARY"
      - name: No binary release
        if: always()
        run: |
          echo 'No DEX/APK binary uploaded, installed or signed.' >> "$GITHUB_STEP_SUMMARY"
