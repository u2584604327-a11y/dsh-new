name: DSH P22 Android35 real isolated execve versioned APK ZIP dependency test
on:
  pull_request:
    paths:
      - 'host_candidate/p22_ziplink/**'
      - '.github/workflows/p22-zip-versioned-exec.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsh-p22-versioned-zip-exec-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-real-android35-versioned-soname:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 35 and real Android NDK x86_64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager";then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 2>/dev/null | head -n1 || true)"
          fi
          test -n "$manager"
          "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          NDK=""
          if test -d "$SDK/ndk";then
            NDK="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1 || true)"
          fi
          if test -z "$NDK";then
            "$manager" --sdk_root="$SDK" 'ndk;27.2.12479018'
            NDK="$SDK/ndk/27.2.12479018"
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          echo "SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$NDK" >> "$GITHUB_ENV"
      - name: Compile real ELF executable and versioned .so.3 shared library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/native out/classes out/dex out/apk/lib/x86_64
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          "$CC" -fPIC -shared -O2 \
            -Wl,-soname,libp22version.so.3 -Wl,-z,max-page-size=16384 \
            host_candidate/p22_ziplink/native/versioned.c \
            -o out/native/libp22version.so.3
          "$CC" -fPIE -pie -O2 -Wl,-z,max-page-size=16384 \
            host_candidate/p22_ziplink/native/main.c \
            -L out/native -l:libp22version.so.3 \
            -o out/native/libp22probe_exec.so
          "$CC" -fPIC -shared -O2 -Wl,-z,max-page-size=16384             host_candidate/p22_ziplink/native/zipbridge.c -ldl             -o out/native/libp22bridge.so
          readelf -d out/native/libp22probe_exec.so | grep -Fq 'Shared library: [libp22version.so.3]'
          readelf -d out/native/libp22version.so.3 | grep -Fq 'Library soname: [libp22version.so.3]'
          readelf -h out/native/libp22probe_exec.so | grep -Fq 'Advanced Micro Devices X86-64'
          echo 'P22_TEST_ELF_NEEDED_VERSIONED_SONAME=PASS_STATIC' >> "$GITHUB_STEP_SUMMARY"
      - name: Build disposable isolatedProcess Android35 test APK with 16KiB ZIP ELF alignment
        shell: bash
        run: |
          set -euo pipefail
          javac --release 8 -cp "$SDK_ROOT/platforms/android-35/android.jar" \
            -d out/classes \
            host_candidate/p22_ziplink/android/com/dsh/p22/ziplink/P22ProbeActivity.java \
            host_candidate/p22_ziplink/android/com/dsh/p22/ziplink/P22ZipLinkWorker.java
          jar cf out/p22-test.jar -C out/classes .
          "$SDK_ROOT/build-tools/35.0.0/d8" --min-api 34 \
            --lib "$SDK_ROOT/platforms/android-35/android.jar" \
            --output out/dex out/p22-test.jar
          "$SDK_ROOT/build-tools/35.0.0/aapt" package -f \
            -M host_candidate/p22_ziplink/android/AndroidManifest.xml \
            -I "$SDK_ROOT/platforms/android-35/android.jar" \
            -F out/p22-unsigned.apk
          (cd out/dex && zip -q -j ../p22-unsigned.apk classes.dex)
          cp out/native/libp22version.so.3 out/apk/lib/x86_64/
          cp out/native/libp22probe_exec.so out/apk/lib/x86_64/
          cp out/native/libp22bridge.so out/apk/lib/x86_64/
          (cd out/apk && zip -q -0 ../p22-unsigned.apk \
            lib/x86_64/libp22probe_exec.so lib/x86_64/libp22version.so.3             lib/x86_64/libp22bridge.so)
          python3 host_candidate/p22_ziplink/align_test_apk.py out/p22-unsigned.apk \
            --out out/p22-aligned.apk --report out/p22-zip-align.json
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 4 out/p22-aligned.apk
          LAB_PASSWORD="$(openssl rand -hex 16)"
          keytool -genkeypair -alias disposable -keyalg RSA -keysize 3072 \
            -validity 1 -storetype PKCS12 \
            -dname 'CN=P22 DISPOSABLE ZIP LINKER PROOF ONLY' \
            -keystore out/p22-ci-key.p12 -storepass "$LAB_PASSWORD" \
            -keypass "$LAB_PASSWORD" -noprompt >/dev/null 2>&1
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks out/p22-ci-key.p12 --ks-key-alias disposable \
            --ks-pass "pass:$LAB_PASSWORD" --key-pass "pass:$LAB_PASSWORD" \
            --out out/p22-disposable.apk out/p22-aligned.apk
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify out/p22-disposable.apk
          if grep -Fq '<uses-permission' host_candidate/p22_ziplink/android/AndroidManifest.xml;then
            echo "::error::Test package requests unexpected permissions";exit 1
          fi
          echo 'P22_TEST_APK_X86_64_16K_ALIGNED_SIGNED_EPHEMERAL=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable KVM
        shell: bash
        run: |
          if test -c /dev/kvm;then sudo chmod 666 /dev/kvm;fi
      - name: Real Android35 isolated UID execve+versioned DT_NEEDED from APK ZIP
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p22_ziplink/run_emulator.sh
      - name: Always destroy synthetic executable APK, ephemeral signing key, and logs
        if: always()
        shell: bash
        run: |
          rm -rf out
          echo 'P22_REAL_DSH_ARM64_NODE_EXECUTED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P22_ORIGINAL_DSH_SIGNER_USED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P22_REAL_USER_PHONE_OR_PRODUCTION_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"
