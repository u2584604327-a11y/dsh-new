name: P89 existing SSE InputStream, tool fragments, Android main-thread paint
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p89_existing_stream/**'
      - 'host_candidate/p43_original_service/build_embedded_emulator_apk.sh'
      - 'host_candidate/p43_original_service/android/com/dsh/android/p43/P43ProbeActivity.java'
      - '.github/workflows/p89-existing-inputstream-tool.yml'
      - 'host_candidate/P89_EXISTING_STREAM_GATE.md'
permissions:
  contents: read
jobs:
  p89-existing-response-only:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p89-existing-inputstream-tool-delta-20261030' &&
      github.event.pull_request.base.ref == 'dsh/p88-original-chat-sse-consumer-ui-owners-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '1'
      P51_X86_SIMULATOR_ONLY: '1'
      P72_ACCESSOR_FIXTURE_ONLY: '1'
      P74_FIXTURE_ENGINE_BRIDGE: '1'
      P75_RENDEZVOUS_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Existing source incremental HTTP contract; no automatic POST
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "u2584604327-a11y/dshe"
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          mkdir -p .p89_private/jvm
          javac --release 8 -d .p89_private/jvm \
            host_candidate/p87_omnigate_sse/src/com/dsh/android/p87/P87SseDecoder.java \
            host_candidate/p87_omnigate_sse/test/com/dsh/android/p87/P87SseDecoderTest.java \
            host_candidate/p87_omnigate_sse/test/com/dsh/android/p87/P87HttpStreamingTest.java \
            host_candidate/p89_existing_stream/src/com/dsh/android/p89/P89ExistingStreamPump.java \
            host_candidate/p89_existing_stream/test/com/dsh/android/p89/P89ExistingStreamPumpTest.java
          java -cp .p89_private/jvm com.dsh.android.p87.P87SseDecoderTest
          java -cp .p89_private/jvm com.dsh.android.p87.P87HttpStreamingTest
          java -cp .p89_private/jvm com.dsh.android.p89.P89ExistingStreamPumpTest | tee .p89_private/p89-jvm.log
          grep -Fxq 'P89_EXISTING_INPUTSTREAM_LIVE_INCREMENTAL_BEFORE_DONE=PASS' .p89_private/p89-jvm.log
          grep -Fxq 'P89_PREMATURE_EOF_FAILCLOSED=PASS' .p89_private/p89-jvm.log
          bash -n host_candidate/p89_existing_stream/run_android_pipe.sh
          bash -n host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          echo 'P89_JVM_REAL_PIPED_INPUTSTREAM_AND_P87_HTTP_CHUNKED=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare pinned disposable original-derived Android build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          SDK="$ANDROID_HOME"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager"; then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 | head -n1 || true)"
          fi
          test -n "$manager"
          "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p89_private/build.log 2>&1 || {
            grep -E 'P89_|P47_|P51_|error:|Traceback' .p89_private/build.log | tail -n 80 || true
            exit 1
          }
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p89_private/build.log
          grep -Fxq 'P51_SIGNED_APK_SEPARATE_PACKAGE_NO_PERMISSIONS=PASS' .p89_private/build.log
          echo 'P89_DISPOSABLE_NO_PERMISSION_ANDROID_SOURCE_BUILD=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Preinstall SDK emulator with bounded corrupt-ZIP recovery (runner only)
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager"; then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 | head -n1 || true)"
          fi
          test -n "$manager"
          installed=0
          for attempt in 1 2 3; do
            if "$manager" --sdk_root="$SDK" --install emulator --channel=0 > .p89_private/emulator-install.log 2>&1 &&
               test -x "$SDK/emulator/emulator" &&
               "$SDK/emulator/emulator" -version >/dev/null 2>&1; then
              installed=1
              break
            fi
            echo "P89_ANDROID_EMULATOR_DOWNLOAD_ATTEMPT_${attempt}=FAILED_TRANSIENT"
            # Bounded deletion affects only the new ephemeral CI runner's SDK installation.
            rm -rf "$SDK/emulator"
            sleep $((attempt * 3))
          done
          if test "$installed" != 1; then
            echo "P89_EMULATOR_INSTALLATION=INFRA_BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 .p89_private/emulator-install.log | sed -E 's#https?://[^ ]+#URL_REDACTED#g'
            exit 1
          fi
          echo "P89_ANDROID_EMULATOR_PREINSTALLED_AND_VERSION_VERIFIED=PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Grant KVM access when present
        run: if test -c /dev/kvm;then sudo chmod 666 /dev/kvm;fi
      - name: Android35 live pipe to incremental TextView and tool assembler
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p89_existing_stream/run_android_pipe.sh
      - name: Always delete pinned original and test-only APK and report boundaries
        if: always()
        run: |
          rm -rf .p89_private .p43tmp
          {
            echo 'P89_ORIGINAL_DSH_MAIN_CHAT_NETWORK_READER=NOT_WIRED'
            echo 'P89_OMNIGATE_LIVE_SSE_TO_ORIGINAL_CHAT_UI=NOT_VERIFIED'
            echo 'P89_NO_EXTRA_POST_NO_OWNER_PORT_CHANGE=YES'
            echo 'P89_TOOLCALL_ASSEMBLY_DOES_NOT_EXECUTE_TOOLS=YES'
            echo 'P89_FIXED_SIGNED_V139_RELEASE=BLOCKED'
            echo 'P89_NO_BINARY_ARTIFACT_PUBLISHED=YES'
          } >> "$GITHUB_STEP_SUMMARY"
