name: DSH P51 private side-by-side ARM64 Node probe package + x86 Binder test
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p49_original_node_stage.py'
      - 'host_candidate/p50_original_arm64_node/**'
      - 'host_candidate/p51_side_by_side/**'
      - 'host_candidate/p43_original_service/**'
      - 'host_candidate/p48_process_proxy/**'
      - 'host_candidate/p43_original_service/build_embedded_emulator_apk.sh'
      - 'host_candidate/P51_SIDE_BY_SIDE_TEST_RELEASE_GATES.md'
      - '.github/workflows/p51-side-by-side-arm64-probe.yml'
permissions:
  contents: read
concurrency:
  group: p51-side-by-side-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  p51-privately-distributed-side-by-side-exact-arm64-apk:
    needs: p51-x86-private-sidecar-binder-and-p37-positive
    permissions:
      contents: write
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p51-side-by-side-original-derived-arm64-probe-20261030' &&
      github.event.pull_request.base.ref == 'dsh/p50-original-arm64-node-worker-integration-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P49_NODE_STAGE: '1'
      P51_SIDE_BY_SIDE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Private repository preflight and exact Node staging source validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO" --jq .visibility)" = private
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P49_NODE_STAGE" = 1
          test "$P51_SIDE_BY_SIDE" = 1
          python -m py_compile host_candidate/p51_side_by_side/p51_manifest.py
          python host_candidate/p51_side_by_side/test_manifest.py
          bash -n host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          worker=host_candidate/p50_original_arm64_node/android/com/dsh/android/p50/P50OriginalNodeFixedChild.java
          grep -Fq 'libdshnode_p21_exec.so' "$worker"
          grep -Fq 'p49-original-node-lock.json' "$worker"
          grep -Fq 'P50_REQUIRES_REAL_ARM64_ISOLATED_ANDROID' "$worker"
          grep -Fq 'P50_WORKER_HAS_INTERNET_PERMISSION' "$worker"
          test "$(grep -Fc 'pb.start()' "$worker")" = 1
          ! grep -Ei 'Runtime\.getRuntime\(\)\.exec\(|magisk|kernelsu|/dev/(mem|kmem)' "$worker"
          grep -Fq 'P50OriginalNodeFixedChild.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P50OriginalNodeFixedChild' host_candidate/p43_original_service/android/com/dsh/android/p43/P43IsolatedWorker.java
          python -m py_compile host_candidate/p49_original_node_stage.py
          python -m py_compile host_candidate/p47_no_fallback/p47_gate.py
          ! grep -Ei 'Runtime\.getRuntime\(\)\.exec\(|\bsu\b|magisk|kernelsu' \
            host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool binutils
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager";then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 | head -n1 || true)"
          fi
          test -n "$manager"
          "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Derive 11 source-verified ARM64 ELF from original exact v138 and embed in original APK
        shell: bash
        run: |
          set -euo pipefail
          bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh \
            > .p49-private-build.log 2>&1 || {
              echo 'P49_PRIVATE_BUILD_FAILED=YES'
              grep -E 'P49_|P47_BLOCKED|RuntimeError|ValueError|ERROR|Traceback|FileNotFoundError|CalledProcessError|not found|No such file|INVALID|DRIFT' \
                .p49-private-build.log | tail -n 30 || true
              echo 'P49_LAST_BUILD_LINES_FOR_PRIVATE_TRIAGE_START'
              tail -n 28 .p49-private-build.log | sed -E 's/(SECRET|TOKEN|PASSWORD|KEY)=([^ ]+)/\1=[REDACTED]/Ig'
              echo 'P49_LAST_BUILD_LINES_END'
              exit 1
            }
          grep -Fq 'P49_EXACT_ORIGINAL_NODE_ELF_SHA256=PASS' .p49-private-build.log
          grep -Fq 'P49_ORIGINAL_TEN_ELF_DEPENDENCIES=PASS' .p49-private-build.log
          grep -Fq 'P49_REAL_ORIGINAL_DSH_ASSETS_AND_LIBRARIES_BYTE_PRESERVED=PASS' .p49-private-build.log
          grep -Fq 'P49_11_ADDITIONAL_ARM64_ELF_STORED_16K_AND_SHA=PASS' .p49-private-build.log
          grep -Fq 'P49_EXTRA_APK_MEMBERS_ALLOWLIST=PASS' .p49-private-build.log
          grep -Fq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p49-private-build.log
          echo 'P49_EXACT_NODE_LIBS_IN_ORIGINAL_DSH_APK=PASS_STATIC' >> "$GITHUB_STEP_SUMMARY"
          echo 'P49_ORIGINAL_ASSETS_AND_ORIGINAL_LIBS_PRESERVED=PASS_STATIC' >> "$GITHUB_STEP_SUMMARY"
          echo 'P49_SHA256_AND_16K_NATIVE_STORED_ENTRIES=PASS_STATIC' >> "$GITHUB_STEP_SUMMARY"
          echo 'P49_MAIN_ENGINE_HOST_FALLBACK=BLOCKED_BY_P47' >> "$GITHUB_STEP_SUMMARY"
          echo 'P50_ARM64_NODE_RUNTIME_EXECUTION=NOT_TESTED_IN_CI' >> "$GITHUB_STEP_SUMMARY"
          grep -Fq 'P51_SIGNED_APK_SEPARATE_PACKAGE_NO_PERMISSIONS=PASS' .p49-private-build.log
          grep -Fq 'P51_NO_PERMISSIONS_AND_SEPARATE_SIGNER=PASS' .p49-private-build.log
          grep -Fq 'P51_ORIGINAL_DSH_PACKAGE_CANNOT_BE_UPDATED_BY_THIS_APK=PASS' .p49-private-build.log
          mkdir -p .p51delivery
          cp .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            .p51delivery/P51-Side-by-Side-ARM64-Isolated-Node-TEST-ONLY.apk
          test -s .p51delivery/P51-Side-by-Side-ARM64-Isolated-Node-TEST-ONLY.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging .p51delivery/P51-Side-by-Side-ARM64-Isolated-Node-TEST-ONLY.apk \
            | grep -Fq "package: name='com.dsh.p51.isolatedprobe'"
          "$aapt" dump permissions .p51delivery/P51-Side-by-Side-ARM64-Isolated-Node-TEST-ONLY.apk \
            | grep -E '^uses-permission:' && {
              echo 'P51_DISTRIBUTION_BLOCKED_PERMISSIONS_FOUND';exit 1;
            } || true
          sha256sum .p51delivery/*.apk | awk '{print "P51_PRIVATE_TEST_ARTIFACT_SHA256="$1}' \
            >> "$GITHUB_STEP_SUMMARY"
          echo 'P51_PRIVATE_ARTIFACT_SEPARATE_PACKAGE=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'P51_ARM64_RUNTIME_NOT_TESTED_IN_CI=YES' >> "$GITHUB_STEP_SUMMARY"
      - name: Create private DRAFT test Release after all package and emulator gates PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO" --jq .visibility)" = private
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GH_REPO"
          test "${{ github.event.pull_request.base.ref }}" = "dsh/p50-original-arm64-node-worker-integration-20261030"
          test "$P51_SIDE_BY_SIDE" = 1
          test "$P49_NODE_STAGE" = 1
          apk=".p51delivery/P51-Side-by-Side-ARM64-Isolated-Node-TEST-ONLY.apk"
          test -s "$apk"
          python host_candidate/p51_side_by_side/p51_manifest.py verify "$apk"
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          test "${#sha}" = 64
          head_sha="${{ github.event.pull_request.head.sha }}"
          tag="p51-sidecar-arm64-test-${head_sha:0:12}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1;then
            echo 'P51_BLOCKED_TAG_ALREADY_EXISTS_NO_ASSET_OVERWRITE'
            exit 1
          fi
          cat > .p51delivery/RELEASE_NOTES.txt <<EONOTE
          P51 private ARM64 side-by-side test APK. NOT DSH v139.
          SHA256: $sha
          App package: com.dsh.p51.isolatedprobe (distinct from com.dsh.android).
          Intended installation: Android 34+ ARM64. Original phone data untouched.
          No declared permissions; launcher test UI and isolated worker only.
          Contains original SHA-pinned v138 Node ELF and 10 libraries.
          This has NOT passed an ARM64 phone runtime execution test.
          On first launch it runs a bounded synthetic Node UID/BOOT/READY test.
          Copy only the status (long-press) if testing. No automatic reports.
          Never uninstall or replace your existing com.dsh.android app.
          NOT original DSH MainActivity, production chat/browser or full VM.
          Test cert is disposable; do not use as a formal software upgrade.
          EONOTE
          gh release create "$tag" "$apk#P51-Side-by-Side-ARM64-Isolated-Node-TEST-ONLY.apk" \
            --repo "$GH_REPO" --target "$head_sha" --draft \
            --title "P51 PRIVATE ARM64 ISOLATED NODE TEST ONLY - NOT DSH V139" \
            --notes-file .p51delivery/RELEASE_NOTES.txt
          gh release view "$tag" --repo "$GH_REPO" --json isDraft \
            --jq .isDraft | grep -Fxq true
          echo "P51_PRIVATE_DRAFT_TEST_RELEASE_TAG=$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "P51_PRIVATE_TEST_APK_SHA256=$sha" >> "$GITHUB_STEP_SUMMARY"
          echo 'P51_ANDROID_ARM64_RUNTIME_TEST=NOT_DONE' >> "$GITHUB_STEP_SUMMARY"
      - name: Always wipe private source and derived APK, exact ELF, runtime lock, and signing key
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p49-private-build.log .p51delivery
          echo 'P51_PRIVATE_DRAFT_RELEASE_ONLY_NO_ACTIONS_ARTIFACT=YES' >> "$GITHUB_STEP_SUMMARY"
          echo 'P51_OWNER_DSH_APP_AND_DATA=NOT_TOUCHED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P49_PRODUCTION_FIXED_SIGNING_KEY_USED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P50_ANDROID16_ARM64_RUNTIME_AND_NODE_ENV=NOT_TESTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P50_FULL_CHAT_BROWSER_FILES_PARITY=NOT_TESTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P51_V139_RELEASE=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
  p51-x86-private-sidecar-binder-and-p37-positive:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p51-side-by-side-original-derived-arm64-probe-20261030' &&
      github.event.pull_request.base.ref == 'dsh/p50-original-arm64-node-worker-integration-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '1'
      P51_X86_SIMULATOR_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed original Node bridge JVM canary and static Python validity
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO" --jq .visibility)" = private
          python host_candidate/p51_side_by_side/test_manifest.py
          bash -n host_candidate/p51_side_by_side/run_x86_sidecar_emulator.sh
          mkdir -p .p47tests
          python -m py_compile host_candidate/p47_no_fallback/p47_gate.py
          javac --release 8 -d .p47tests \
            host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java \
            host_candidate/p47_no_fallback/test/com/dsh/android/p47/P47LaunchGateTest.java
          java -cp .p47tests com.dsh.android.p47.P47LaunchGateTest | tee .p47-jvm.txt
          grep -Eq '^P47_JAVA_PROCESS_BUILDER_DENY_TESTS=PASS assertions=[0-9]+$' .p47-jvm.txt
          grep -Fxq 'P47_NO_HOST_SPAWN_CANARY=PASS' .p47-jvm.txt
          ! grep -E 'builder\.start\(|getRuntime\(\)\.exec\(|new ProcessBuilder\(' \
             host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java
          grep -Fq 'new ProcessBuilder("/system/bin/id","-u")' \
            host_candidate/p48_process_proxy/android/com/dsh/android/p48/P48FixedIsolatedChild.java
          grep -Fq 'new P37RemoteProcess(' \
            host_candidate/p48_process_proxy/android/com/dsh/android/p48/P48HostProcessProbe.java
          grep -Fq 'P48FixedIsolatedChild.START' \
            host_candidate/p43_original_service/android/com/dsh/android/p43/P43IsolatedWorker.java
          echo 'P48_P47_NO_FALLBACK_JVM_GATE=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore immutable original DSH APK build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager"; then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 | head -n1 || true)"
          fi
          test -n "$manager"
          "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Rebuild actual original DSH with P47 no-fallback and P48 isolated child / P37 proxy
        shell: bash
        run: |
          set -euo pipefail
          P47_NO_HOST_FALLBACK=1 bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          echo 'P48_ORIGINAL_APK_P37_PROXY_AND_ISOLATED_WORKER_COMPILED=PASS_STATIC' >> "$GITHUB_STEP_SUMMARY"
          echo 'P48_ORIGINAL_MAIN_START_P47_DENY_RETAINED=PASS_STATIC' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable emulator hardware acceleration when available
        shell: bash
        run: if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Android35 distinct P51 sidecar isolated Binder and P37 positive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p51_side_by_side/run_x86_sidecar_emulator.sh
      - name: Always discard temporary original APK, ephemeral key and tests
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p47tests .p47-jvm.txt
          echo 'P48_ORIGINAL_V138_PHONE_APK_MODIFIED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P48_FIXED_SIGNING_KEY_USED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P51_X86_TEST_APK_PUBLISHED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P50_NODE_PRODUCTION_ISOLATION=NOT_IMPLEMENTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P50_ORIGINAL_CHAT_BROWSER_FILES_PARITY=NOT_TESTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P51_V139_RELEASE=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
