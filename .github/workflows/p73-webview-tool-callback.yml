name: P73 actual Android WebView browser tool callback and native consent
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p73_webview_callback/**'
      - 'host_candidate/p43_original_service/build_embedded_emulator_apk.sh'
      - 'host_candidate/p43_original_service/android/com/dsh/android/p43/P43ProbeActivity.java'
      - 'host_candidate/P73_NATIVE_TOOL_CALLBACK_GATE.md'
      - '.github/workflows/p73-webview-tool-callback.yml'
permissions:
  contents: read
jobs:
  real-android35-webview-tool-callback:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p73-webview-tool-result-callback-probe-20261030' &&
      github.event.pull_request.base.ref == 'dsh/p72-browserbridge-webview-access-rootcause-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '1'
      P51_X86_SIMULATOR_ONLY: '1'
      P72_ACCESSOR_FIXTURE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Original source scope, one-shot result JVM regression, Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "u2584604327-a11y/dshe"
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P51_SIDE_BY_SIDE" = 1
          bash -n host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          bash -n host_candidate/p73_webview_callback/run_emulator_tool.sh
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python host_candidate/p72_webview_access/test_exact_patch.py
          mkdir -p .p73_jvm
          javac --release 8 -d .p73_jvm host_candidate/p71_browser_runtime/src/com/dsh/android/p71/P71ToolReplyOnce.java host_candidate/p71_browser_runtime/test/com/dsh/android/p71/P71ToolReplyOnceTest.java
          java -cp .p73_jvm com.dsh.android.p71.P71ToolReplyOnceTest > .p73_jvm.log
          grep -Eq '^P71_TOOL_RESULT_EXACTLY_ONCE_JVM=PASS assertions=[0-9]+$' .p73_jvm.log
          grep -Fxq 'P71_COMMENT_PUBLISH_NATIVE_CONSENT_REQUIRED=PASS' .p73_jvm.log
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          SDK="$ANDROID_HOME"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager";then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 | head -n1 || true)"
          fi
          test -n "$manager"
          "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          echo 'P73_JVM_EXACTLY_ONCE_AND_CONSENT=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Exact pinned original v138 derived private test APK build
        shell: bash
        run: |
          set -euo pipefail
          bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p73_build.log 2>&1 || {
            grep -E 'P72_|P73_|P47_|P51_|error:|Traceback' .p73_build.log | tail -n 50 || true
            exit 1
          }
          grep -Fxq 'P72_REBUILT_MAIN_DEX_CURRENT_WEBVIEW_IS_PUBLIC=PASS' .p73_build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p73_build.log
          grep -Fxq 'P51_SIGNED_APK_SEPARATE_PACKAGE_NO_PERMISSIONS=PASS' .p73_build.log
          test -s .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk
          echo 'P73_EPHEMERAL_SIDECAR_BUILD=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable KVM
        run: if test -c /dev/kvm;then sudo chmod 666 /dev/kvm;fi
      - name: Android35 real read scroll find draft and no-publication callback chain
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p73_webview_callback/run_emulator_tool.sh
      - name: Always delete original APK derived binary and ephemeral private signer
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p73_build.log .p73_jvm .p73_jvm.log
          echo 'P73_REAL_BILIBILI_ACCOUNT_NEVER_ACCESSED=YES' >> "$GITHUB_STEP_SUMMARY"
          echo 'P73_ORIGINAL_DSH_PROFILE_UNCHANGED=YES' >> "$GITHUB_STEP_SUMMARY"
          echo 'P73_ORIGINAL_MODEL_TOOL_RESUME=NOT_WIRED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P73_FIXED_SIGNED_V139=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
