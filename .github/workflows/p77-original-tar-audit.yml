name: P77 original full TAR SHA256 inside Android isolated UID
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p77_engine_tar_audit/**'
      - 'host_candidate/p76_original_engine_fd/**'
      - 'host_candidate/p43_original_service/build_embedded_emulator_apk.sh'
      - 'host_candidate/P77_REAL_ORIGINAL_TAR_ISOLATED_FULL_TREE_GATE.md'
      - '.github/workflows/p77-original-tar-audit.yml'
permissions:
  contents: read
jobs:
  exact-original-tar-isolated:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p77-original-engine-tar-isolated-audit-20261030' &&
      github.event.pull_request.base.ref == 'dsh/p76-real-original-engine-archive-isolated-fd-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '1'
      P51_X86_SIMULATOR_ONLY: '1'
      P72_ACCESSOR_FIXTURE_ONLY: '1'
      P74_FIXTURE_ENGINE_BRIDGE: '1'
      P75_RENDEZVOUS_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Synthetic TAR negative cases and original APK build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "u2584604327-a11y/dshe"
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P51_SIDE_BY_SIDE" = 1
          mkdir -p .p77_jvm
          javac --release 8 -d .p77_jvm \
            host_candidate/p77_engine_tar_audit/src/com/dsh/android/p77/P77TarAudit.java \
            host_candidate/p77_engine_tar_audit/test/com/dsh/android/p77/P77TarAuditTest.java
          java -cp .p77_jvm com.dsh.android.p77.P77TarAuditTest > .p77_test.log
          grep -Eq '^P77_SYNTHETIC_CANONICAL_TAR_AND_SHA=PASS assertions=[0-9]+$' .p77_test.log
          bash -n host_candidate/p77_engine_tar_audit/run_emulator_tar.sh
          bash -n host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          SDK="$ANDROID_HOME"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager";then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 | head -n1 || true)"
          fi
          "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          echo 'P77_JAVA_TAR_NEGATIVE_CASES=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Build original SHA-pinned independent Android fixture
        shell: bash
        run: |
          set -euo pipefail
          bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p77_build.log 2>&1 || {
            grep -E 'P77_|P76_|P47_|error:|Traceback' .p77_build.log | tail -n 40 || true
            exit 1
          }
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p77_build.log
          grep -Fxq 'P51_SIGNED_APK_SEPARATE_PACKAGE_NO_PERMISSIONS=PASS' .p77_build.log
          echo 'P77_SOURCE_PROVENANCE_BUILD=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: KVM if present
        run: if test -c /dev/kvm;then sudo chmod 666 /dev/kvm;fi
      - name: Genuine isolated Android full original 30411 member verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p77_engine_tar_audit/run_emulator_tar.sh
      - name: Always remove private APK and test signer
        if: always()
        run: |
          rm -rf .p43tmp .p77_jvm .p77_test.log .p77_build.log
          echo 'P77_ORIGINAL_NODE_MODULE_LOADER_AND_READY=NOT_IMPLEMENTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P77_ORIGINAL_PHONE_AND_USER_DATA_UNCHANGED=YES' >> "$GITHUB_STEP_SUMMARY"
          echo 'P77_FIXED_SIGNED_V139=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
