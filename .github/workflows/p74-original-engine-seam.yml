name: P74 original P40 EngineManager bridge -> isolated P37 fixture on Android
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p74_engine_fixture/**'
      - 'host_candidate/p43_original_service/build_embedded_emulator_apk.sh'
      - 'host_candidate/p43_original_service/android/com/dsh/android/p43/P43ProbeActivity.java'
      - 'host_candidate/P74_REAL_ORIGINAL_ENGINE_PROCESS_SEAM_GATE.md'
      - '.github/workflows/p74-original-engine-seam.yml'
permissions:
  contents: read
jobs:
  exact-original-main-dex-to-auth-p37:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p74-exact-engine-bridge-isolated-process-lease-20261030' &&
      github.event.pull_request.base.ref == 'dsh/p73-webview-tool-result-callback-probe-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '1'
      P51_X86_SIMULATOR_ONLY: '1'
      P72_ACCESSOR_FIXTURE_ONLY: '1'
      P74_FIXTURE_ENGINE_BRIDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fixture trust, one-shot lease JVM, default original host deny
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "u2584604327-a11y/dshe"
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P51_SIDE_BY_SIDE" = 1
          test "$P74_FIXTURE_ENGINE_BRIDGE" = 1
          bash -n host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          bash -n host_candidate/p74_engine_fixture/run_emulator_engine_seam.sh
          mkdir -p .p74_jvm
          javac --release 8 -d .p74_jvm \
            host_candidate/p37_remote_process/src/com/dsh/p37/P37RemoteProcess.java \
            host_candidate/p74_engine_fixture/src/com/dsh/android/p74/P74OriginalEngineFixtureHandoff.java \
            host_candidate/p74_engine_fixture/test/com/dsh/android/p74/P74OriginalEngineFixtureHandoffTest.java
          java -cp .p74_jvm com.dsh.android.p74.P74OriginalEngineFixtureHandoffTest > .p74_jvm.log
          grep -Eq '^P74_ORIGINAL_MAIN_BRIDGE_LEASE_JVM=PASS assertions=[0-9]+$' .p74_jvm.log
          grep -Fxq 'P74_NO_DIRECT_HOST_PROCESSBUILDER_START=PASS' .p74_jvm.log
          python -m pip install --no-cache-dir -r host_candidate/requirements.txt
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          SDK="$ANDROID_HOME"
          manager="$(command -v sdkmanager || true)"
          if test -z "$manager";then
            manager="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm /111 | head -n1 || true)"
          fi
          "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          echo 'P74_ONE_SHOT_LEASE_AND_NO_HOST_FALLBACK_JVM=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Exact original SHA-pinned P40/P47+P74 disposable Android APK build
        shell: bash
        run: |
          set -euo pipefail
          bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p74_build.log 2>&1 || {
            grep -E 'P74_|P47_|P51_|P72_|error:|Traceback' .p74_build.log | tail -n 50 || true
            exit 1
          }
          grep -Fxq 'P74_DISPOSABLE_P47_GATE_DELEGATES_TO_ONE_SHOT_ISOLATED_PROXY=PASS' .p74_build.log
          grep -Fxq 'P74_P47_SOURCE_IN_REPOSITORY_UNCHANGED=YES' .p74_build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p74_build.log
          grep -Fxq 'P51_SIGNED_APK_SEPARATE_PACKAGE_NO_PERMISSIONS=PASS' .p74_build.log
          echo 'P74_ORIGINAL_MAIN_DEX_EXACT_ENGINE_INTERPOSITION=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: KVM when available
        run: if test -c /dev/kvm;then sudo chmod 666 /dev/kvm;fi
      - name: Android35 real original engine bridge returns P37 after Binder child-start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p74_engine_fixture/run_emulator_engine_seam.sh
      - name: Always delete exact source APK, temporary signer and test class output
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p74_build.log .p74_jvm .p74_jvm.log
          echo 'P74_REAL_ORIGINAL_ENGINE_MANAGER_COROUTINE=NOT_WIRED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P74_PRODUCTION_JS_READY_EXIT_CANCEL=NOT_TESTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P74_FIXED_SIGNING_KEY_ACCESSED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P74_OWNER_INSTALLED_DSH_UNCHANGED=YES' >> "$GITHUB_STEP_SUMMARY"
          echo 'P74_FORMAL_V139=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
