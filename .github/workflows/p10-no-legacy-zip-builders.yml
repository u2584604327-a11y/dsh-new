name: DSH P10 remaining legacy diagnostic ZIP builders default-deny
on:
  push:
    branches: [main]
    paths:
      - 'host_candidate/patch_remaining_bundle_calls.py'
      - '.github/workflows/p10-no-legacy-zip-builders.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-baseline-bytecode-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get original private v138 APK and exact hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          gh release download dsh-baseline-v135dsh-baseline-v135 --repo "$GH_REPO" \
            --pattern DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk --dir input
          printf '%s  %s\n' 3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5 \
            input/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk | sha256sum -c -
          python -m pip install -r host_candidate/requirements.txt
      - name: Replay ART-safe P1-P9 and verify both P10 methods
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys,zipfile
          sys.path.insert(0,'host_candidate')
          from patch_deny import sha
          from patch_deny_art_safe import apply_art_safe
          import patch_browser,patch_privacy,patch_native_export_reply,patch_native_export_failclosed,patch_remaining_bundle_calls
          with zipfile.ZipFile('input/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk') as apk:
              original=apk.read('classes.dex')
          d1,_=apply_art_safe(original)
          patch_browser.EXPECTED_P1=sha(d1)
          d2,_=patch_browser.apply_browser(d1)
          patch_privacy.EXPECTED=sha(d2)
          d3,_=patch_privacy.apply_privacy(d2)
          patch_native_export_reply.EXPECTED_P2=sha(d3)
          d4,_=patch_native_export_reply.apply(d3)
          d5,_=patch_native_export_failclosed.apply(d4)
          d6,report=patch_remaining_bundle_calls.apply(d5)
          assert report["ALL_DIRECT_EXTERNAL_DIAGNOSTIC_BUILD_DEFAULT_CALLS"]=="ZERO_STATIC"
          assert len(report["PATCHED_ORIGINAL_METHODS"])==2
          print(json.dumps(report,indent=2))
          PY
          echo 'P10_TWO_NATIVE_CALLS_DEFAULT_DENIED=PASS_STATIC' >> "$GITHUB_STEP_SUMMARY"
          echo 'P10_EXTERNAL_DIRECT_BUNDLE_BUILDER_CALLS=ZERO_STATIC' >> "$GITHUB_STEP_SUMMARY"
          echo 'P10_ART_EMULATOR=NOT_VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P10_PRODUCTION_APK=NOT_BUILT' >> "$GITHUB_STEP_SUMMARY"
      - name: Do not export private APK binaries
        if: always()
        run: |
          echo 'No APK, DEX, user data, signing material or binary artifacts uploaded.' >> "$GITHUB_STEP_SUMMARY"
